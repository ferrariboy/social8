<!DOCTYPE html>
<html lang="en-CA" class="w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BC Grade 8 Social Studies Discovery Portal</title>
    
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
            }
          }
        }
      }
    </script>

    <style>
        /* Modern baseline resets to completely prevent unwanted horizontal scrollbars */
        html {
            width: 100%;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f8fafc;
        }

        /* Complete scrollbar elimination for selectors, pills, and mobile viewports */
        .no-scrollbar::-webkit-scrollbar,
        .hide-scrollbar::-webkit-scrollbar,
        #moduleFilterPills::-webkit-scrollbar,
        #drawerModulesList::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        .no-scrollbar,
        .hide-scrollbar,
        #moduleFilterPills,
        #drawerModulesList {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        /* Suppress scrollbars on mobile/touch screens while retaining smooth scrollability */
        @media (max-width: 768px) {
            *::-webkit-scrollbar {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
            }
            * {
                -ms-overflow-style: none !important;
                scrollbar-width: none !important;
            }
        }

        /* Desktop subtle scrollbar only for broad screens */
        @media (min-width: 769px) {
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: #f1f5f9; }
            ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        }

        /* Focus & touch ergonomics */
        button:focus-visible, a:focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 2px;
        }
        .active-scale:active {
            transform: scale(0.98);
        }

        /* Off-canvas Curriculum Drawer */
        #curriculumDrawer {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        #drawerBackdrop {
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .drawer-open #curriculumDrawer {
            transform: translateX(0);
        }
        .drawer-open #drawerBackdrop {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col antialiased text-slate-800">
    
    <!-- Top 100% Width Sticky Header (Mobile Uncut & Responsive) -->
    <header class="sticky top-0 bg-slate-900 text-white border-b border-slate-800 z-40 w-full px-3 sm:px-8 lg:px-12 xl:px-16 py-2 sm:py-3 shadow-md">
        <div class="w-full flex items-center justify-between gap-2 sm:gap-4">
            
            <!-- Left: Brand Logo & Context Home Button -->
            <div class="flex items-center gap-1.5 sm:gap-3 min-w-0 shrink">
                <button 
                    id="globalBackBtn" 
                    aria-label="Return to Dashboard Hub"
                    class="text-indigo-300 hover:text-white font-bold text-xs sm:text-sm min-h-[40px] sm:min-h-[44px] px-2.5 sm:px-3.5 flex items-center gap-1.5 sm:gap-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 active:bg-slate-600 transition-colors active-scale shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                    </svg>
                    <span class="hidden sm:inline">Dashboard</span>
                    <span class="sm:hidden">Back</span>
                </button>

                <div class="h-6 w-px bg-slate-800 hidden sm:block"></div>

                <a href="javascript:void(0)" id="headerHomeLogo" class="flex items-center gap-2 sm:gap-3 group cursor-pointer py-1 min-w-0">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white font-black shadow-inner shadow-indigo-400/30 shrink-0">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 8l4 4-4 4-4-4 4-4z"/>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <div class="font-black text-sm sm:text-base lg:text-lg text-white tracking-tight leading-tight group-hover:text-indigo-300 transition-colors truncate">
                            <span class="hidden md:inline">BC </span>Socials 8
                        </div>
                        <div class="text-[10px] sm:text-xs text-slate-400 font-medium leading-none hidden lg:block">
                            c. 600 - 1750 CE Discovery Portal
                        </div>
                    </div>
                </a>
            </div>

            <!-- Center: Active View Title / Breadcrumb context -->
            <div class="flex-1 text-center px-2 hidden md:block min-w-0">
                <h1 
                    id="headerViewTitle" 
                    class="text-sm lg:text-base font-bold text-slate-200 tracking-tight truncate max-w-xl mx-auto">
                    Dashboard Hub
                </h1>
            </div>

            <!-- Right: Course Progress Badge & Curriculum Directory Toggle -->
            <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
                
                <!-- Overall Course Progress Badge -->
                <div 
                    id="globalProgressBarBadge" 
                    class="bg-indigo-950 border border-indigo-700/80 text-indigo-300 text-xs sm:text-sm font-black px-2 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2 shadow-sm shrink-0">
                    <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                    <span id="globalProgressText">0% Done</span>
                </div>

                <!-- Curriculum Directory Menu Button -->
                <button 
                    id="navMenuToggleBtn" 
                    aria-label="Open Curriculum Directory Navigation Menu"
                    class="min-h-[40px] sm:min-h-[48px] px-3 sm:px-4 py-1.5 sm:py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white flex items-center justify-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-bold shadow-md transition-colors active-scale shrink-0">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                    </svg>
                    <span><span class="hidden sm:inline">Curriculum </span>Menu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container: 100% Full Width across all viewports -->
    <main id="viewDisplayEngine" class="w-full flex-grow px-3 sm:px-8 lg:px-12 xl:px-16 py-6 sm:py-8">
        <!-- SPA viewDisplayEngine dynamically rendered by app.js -->
    </main>

    <!-- 100% Width Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-6 px-4 sm:px-8 lg:px-12 xl:px-16 text-xs text-slate-500 w-full">
        <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="font-bold text-slate-700">BC Grade 8 Social Studies Discovery Portal</span>
                <span>• Aligned with the British Columbia Ministry of Education Curriculum (c. 600 - 1750 CE)</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="footerResetBtn" class="text-slate-400 hover:text-rose-600 underline font-medium transition-colors">
                    Reset Progress
                </button>
                <span>•</span>
                <span class="text-slate-400">Pure Client-Side SPA</span>
            </div>
        </div>
    </footer>

    <!-- Slide-over Curriculum Navigation Drawer -->
    <div id="drawerBackdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300" aria-hidden="true"></div>
    <aside 
        id="curriculumDrawer" 
        role="dialog"
        aria-modal="true"
        aria-label="Curriculum Navigation Directory"
        class="fixed inset-y-0 right-0 z-50 w-full max-w-full sm:max-w-md bg-slate-900 text-slate-100 shadow-2xl flex flex-col translate-x-full overflow-hidden">
        
        <!-- Drawer Header -->
        <div class="p-4 sm:p-6 border-b border-slate-800 flex items-center justify-between bg-slate-950 shrink-0">
            <div>
                <span class="text-xs font-black uppercase tracking-wider text-indigo-400">Curriculum Directory</span>
                <h2 class="text-lg sm:text-xl font-black text-white">All 8 Modules & 64 Units</h2>
            </div>
            <button 
                id="drawerCloseBtn" 
                aria-label="Close Curriculum Menu"
                class="min-w-[44px] min-h-[44px] rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors active-scale">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Drawer Search / Filter -->
        <div class="p-3 sm:p-4 border-b border-slate-800 bg-slate-900 shrink-0">
            <div class="relative">
                <input 
                    type="text" 
                    id="drawerFilterInput" 
                    placeholder="Search any unit, concept, or artifact..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 sm:py-3 pl-10 text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-400 absolute left-3.5 top-3 sm:top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
                </svg>
            </div>
        </div>

        <!-- Drawer Content: List of Modules & Units -->
        <div id="drawerModulesList" class="flex-grow overflow-y-auto p-4 sm:p-6 space-y-4 no-scrollbar">
            <!-- Dynamically populated by app.js -->
        </div>

        <!-- Drawer Footer -->
        <div class="p-3 sm:p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between text-xs text-slate-400 shrink-0">
            <span id="drawerProgressSummary">0 of 64 Units Completed</span>
            <button id="drawerDashboardJumpBtn" class="text-indigo-400 hover:text-indigo-300 font-bold underline py-1 px-2">
                Dashboard Hub
            </button>
        </div>
    </aside>

    <!-- Master Curriculum Data & Application Scripts (Cache Busted v6.0) -->
    <script src="courseData.js?v=6.0"></script>
    <script src="app.js?v=6.0"></script>
</body>
</html>
