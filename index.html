<!DOCTYPE html>
<html lang="en-CA" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>BC Grade 8 Social Studies Discovery Portal</title>
    
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
            },
            colors: {
              heritage: {
                50: '#fbf8f3',
                100: '#f5eedf',
                200: '#ead8be',
                800: '#4a3b2c',
                900: '#2b2118'
              }
            }
          }
        }
      }
    </script>

    <style>
        /* Modern custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

        /* Focus & touch ergonomics */
        button:focus-visible, a:focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 2px;
        }
        .active-scale:active {
            transform: scale(0.98);
        }

        /* Drawer transition mechanics */
        #curriculumDrawer {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #drawerBackdrop {
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .drawer-open #curriculumDrawer {
            transform: translateX(0);
        }
        .drawer-open #drawerBackdrop {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-slate-100/70 font-sans min-h-screen flex flex-col antialiased text-slate-800">
    
    <!-- Top Global Sticky Header -->
    <header class="sticky top-0 bg-slate-900 text-white border-b border-slate-800 z-40 px-4 sm:px-6 lg:px-8 py-2.5 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Left: Brand Identity & Context Back Button -->
            <div class="flex items-center gap-3">
                <button 
                    id="globalBackBtn" 
                    aria-label="Return to Dashboard Hub"
                    class="text-indigo-300 hover:text-white font-bold text-sm min-h-[44px] px-3 flex items-center gap-1.5 rounded-xl hover:bg-slate-800 active:bg-slate-700 transition-colors active-scale">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                    </svg>
                    <span>Dashboard</span>
                </button>

                <div class="h-6 w-px bg-slate-800 hidden sm:block"></div>

                <a href="javascript:void(0)" id="headerHomeLogo" class="flex items-center gap-2.5 group cursor-pointer py-1">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white font-black shadow-inner shadow-indigo-400/30">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 8l4 4-4 4-4-4 4-4z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="font-black text-sm sm:text-base text-white tracking-tight leading-tight group-hover:text-indigo-300 transition-colors">
                            BC Social Studies 8
                        </div>
                        <div class="text-[11px] text-slate-400 font-medium leading-none hidden sm:block">
                            c. 600 - 1750 CE Discovery Portal
                        </div>
                    </div>
                </a>
            </div>

            <!-- Center: Active View Title (Condensed on mobile, expanded on desktop) -->
            <div class="flex-1 text-center px-2">
                <h1 
                    id="headerViewTitle" 
                    class="text-sm sm:text-base font-bold text-slate-200 tracking-tight truncate max-w-[200px] sm:max-w-md mx-auto">
                    Dashboard Hub
                </h1>
            </div>

            <!-- Right: Progress Badge & Curriculum Menu Toggle -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                
                <!-- Overall Course Progress Badge -->
                <div 
                    id="globalProgressBarBadge" 
                    class="bg-indigo-950/80 border border-indigo-700/60 text-indigo-300 text-xs font-black px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="globalProgressText">0% Done</span>
                </div>

                <!-- Curriculum Navigation Menu Button -->
                <button 
                    id="navMenuToggleBtn" 
                    aria-label="Open Curriculum Navigation Menu"
                    class="min-w-[48px] min-h-[48px] p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white flex items-center justify-center gap-2 text-sm font-bold transition-colors active-scale">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                    </svg>
                    <span class="hidden md:inline">Curriculum Menu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Central Dynamic SPA Engine Container -->
    <main id="viewDisplayEngine" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
        <!-- SPA viewDisplayEngine dynamically populated by client views -->
    </main>

    <!-- Footer Information Bar -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-6 px-4 sm:px-6 lg:px-8 text-xs text-slate-500">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="font-bold text-slate-700">BC Grade 8 Social Studies Discovery Portal</span>
                <span>• Aligned with BC Ministry of Education Curriculum (c. 600 - 1750 CE)</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="footerResetBtn" class="text-slate-400 hover:text-rose-600 underline font-medium transition-colors">
                    Reset Progress
                </button>
                <span>•</span>
                <span class="text-slate-400">Pure Client-Side SPA</span>
            </div>
        </div>
    </footer>

    <!-- Slide-over Curriculum Navigation Drawer -->
    <div id="drawerBackdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300" aria-hidden="true"></div>
    <aside 
        id="curriculumDrawer" 
        role="dialog"
        aria-modal="true"
        aria-label="Curriculum Navigation Directory"
        class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-slate-900 text-slate-100 shadow-2xl flex flex-col translate-x-full transition-transform duration-300">
        
        <!-- Drawer Header -->
        <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
            <div>
                <span class="text-xs font-black uppercase tracking-wider text-indigo-400">Curriculum Directory</span>
                <h2 class="text-lg font-black text-white">All 8 Modules & 24 Units</h2>
            </div>
            <button 
                id="drawerCloseBtn" 
                aria-label="Close Curriculum Menu"
                class="min-w-[48px] min-h-[48px] rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors active-scale">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Drawer Search / Filter -->
        <div class="p-4 border-b border-slate-800/80 bg-slate-900">
            <div class="relative">
                <input 
                    type="text" 
                    id="drawerFilterInput" 
                    placeholder="Search units or historical topics..." 
                    class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
                </svg>
            </div>
        </div>

        <!-- Drawer Content: List of Modules & Units -->
        <div id="drawerModulesList" class="flex-grow overflow-y-auto p-4 space-y-4">
            <!-- Dynamically populated by app.js -->
        </div>

        <!-- Drawer Footer -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/80 flex items-center justify-between text-xs text-slate-400">
            <span id="drawerProgressSummary">0 of 24 Units Completed</span>
            <button id="drawerDashboardJumpBtn" class="text-indigo-400 hover:text-indigo-300 font-bold underline">
                Go to Dashboard
            </button>
        </div>
    </aside>

    <!-- Master Curriculum Data & Application Scripts -->
    <script src="courseData.js"></script>
    <script src="app.js"></script>
</body>
</html>
