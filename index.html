<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>BC Grade 8 Social Studies Discovery Portal</title>
    
    <!-- 1. Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }

        /* Focus & touch target ergonomics */
        button:focus-visible, a:focus-visible {
            outline: 3px solid #6366f1;
            outline-offset: 2px;
        }
        .active\:scale-98:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col antialiased text-slate-800 select-none">
    
    <!-- 3. Sticky Mobile Header Frame -->
    <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-slate-200 z-50 px-4 py-2 shadow-sm flex items-center justify-between min-h-[64px]">
        <!-- 4. Home / Back Button (Touch target >= 48px with clear margins) -->
        <button 
            id="globalBackBtn" 
            aria-label="Return to Dashboard Hub"
            class="text-indigo-600 hover:text-indigo-800 font-black text-base min-w-[48px] min-h-[48px] px-3.5 my-1 flex items-center justify-center rounded-2xl active:bg-slate-100 transition-all active:scale-98">
            ← Home
        </button>

        <!-- View Title Element -->
        <h1 
            id="headerViewTitle" 
            class="text-lg sm:text-xl font-black text-slate-900 tracking-tight truncate max-w-[190px] sm:max-w-xs text-center">
            Dashboard
        </h1>

        <!-- Global Progress Badge -->
        <div 
            id="globalProgressBarBadge" 
            class="bg-indigo-100 text-indigo-900 text-xs sm:text-sm font-black px-3.5 py-1.5 rounded-full shadow-sm shrink-0">
            0% Done
        </div>
    </header>

    <!-- 6. Central Dynamic Master Application Container -->
    <main id="viewDisplayEngine" class="flex-grow max-w-xl mx-auto w-full px-4 py-6">
        <!-- SPA viewDisplayEngine dynamically populated by client views -->
    </main>

    <!-- 2. Master Curriculum Data Script Link -->
    <script src="courseData.js"></script>
    <script src="app.js"></script>
</body>
</html>
